name: Build images

# main   → ghcr.io/<owner>/pure:<php>                    (edge, what main has now)
# v1.2.3 → ghcr.io/<owner>/pure:1.2.3-<php> and :1-<php> (what @v1 templates use)
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths: [Dockerfile, bin/**, config/**, .github/workflows/image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v5
      - run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pure"
          php=${{ matrix.php }}
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
            tags=("$repo:$version-$php" "$repo:${version%%.*}-$php")
          else
            tags=("$repo:$php")
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build --build-arg PHP_VERSION="$php" "${tags[@]/#/--tag=}" .
          for tag in "${tags[@]}"; do docker push "$tag"; done
